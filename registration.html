<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElderGuard</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="firebaseauth.js"></script>
</head>
<body>
    <div class="container">
        <form action="" id="Registration">
            <div class="inputBox">
                <input type="text" id="name" placeholder="Full name">
            </div>
            <div class="inputBox">
                <input type="email" id="emailid" placeholder="Email">
            </div>
            <div class="password">
                <input type="password" id="userpassword" placeholder="Password">
            </div>
            <div class="confirmpassword">
                <input type="password" id="confirmuserpassword" placeholder="Re-Enter password">
            </div>
            <div class="button">
                <button  id="btn" type="button">Register</button>
            </div>
            <div class="login">
                <span> already have an account ?</span> 
                <a href="login.htm" id="loginbtn">login</a>

            </div>
        </form>
    </div>
    <script src="registration.js"></script>
</body>
</html>
